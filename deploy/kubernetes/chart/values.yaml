image: task-agent-instances:local
imagePullPolicy: IfNotPresent
controller:
  maxWorkers: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

archive:
  enabled: true
  name: task-workspace-archives
  size: 20Gi
  accessMode: ReadWriteOnce
  # For multi-node servers, select storage supporting ReadWriteMany.
  storageClass: ""
