apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: taskinstances.tasks.task-agent.dev
spec:
  group: tasks.task-agent.dev
  scope: Namespaced
  names:
    plural: taskinstances
    singular: taskinstance
    kind: TaskInstance
    shortNames: [ti]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Task
          type: string
          jsonPath: .spec.taskId
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Run
          type: integer
          jsonPath: .spec.run
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [taskId, image, desiredState, run, storage, stages, deletionPolicy]
              x-kubernetes-validations:
                - rule: self.run >= oldSelf.run
                  message: Execution generation cannot decrease
                - rule: self.taskId == oldSelf.taskId && self.image == oldSelf.image && self.stages == oldSelf.stages && self.storage == oldSelf.storage
                  message: Task, image, stages and storage are immutable; create a new instance for changed work
                - rule: has(self.repository) == has(oldSelf.repository) && (!has(self.repository) || self.repository == oldSelf.repository)
                  message: Repository snapshot is immutable
                - rule: has(self.reuseSources) == has(oldSelf.reuseSources) && (!has(self.reuseSources) || self.reuseSources == oldSelf.reuseSources)
                  message: Reuse sources are immutable
                - rule: has(self.archive) == has(oldSelf.archive) && (!has(self.archive) || self.archive.claimName == oldSelf.archive.claimName)
                  message: Archive store is immutable
                - rule: has(self.restoreFromTaskId) == has(oldSelf.restoreFromTaskId) && (!has(self.restoreFromTaskId) || self.restoreFromTaskId == oldSelf.restoreFromTaskId)
                  message: Restore source is immutable
                - rule: "has(self.inputSnapshot) == has(oldSelf.inputSnapshot) && (!has(self.inputSnapshot) || self.inputSnapshot == oldSelf.inputSnapshot)"
                  message: Input snapshot is immutable; create a new execution for changed inputs
              properties:
                restoreFromTaskId: {type: string, minLength: 1, maxLength: 256}
                archive:
                  type: object
                  required: [claimName, cleanupOnCompletion]
                  properties:
                    claimName: {type: string, minLength: 1, maxLength: 253}
                    cleanupOnCompletion: {type: boolean}
                inputSnapshot:
                  type: object
                  required: [digest, inputRefs]
                  properties:
                    digest: {type: string, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
                    sources:
                      type: array
                      maxItems: 256
                      items:
                        type: object
                        required: [taskId, hash]
                        properties:
                          taskId: {type: string, maxLength: 256}
                          hash: {type: string, maxLength: 64, pattern: '^[a-f0-9]{64}$'}
                    inputRefs:
                      type: array
                      maxItems: 512
                      items:
                        type: object
                        required: [artifactId, version]
                        properties:
                          artifactId: {type: string, maxLength: 256}
                          version: {type: integer, minimum: 1}
                taskId: {type: string, minLength: 1, maxLength: 256}
                image: {type: string, minLength: 1, maxLength: 512}
                desiredState: {type: string, enum: [Running, Suspended]}
                run: {type: integer, minimum: 1}
                recoveryInstructions: {type: string, maxLength: 8000}
                deletionPolicy: {type: string, enum: [Retain, Delete], default: Retain}
                storage:
                  type: object
                  required: [size]
                  properties:
                    size: {type: string, maxLength: 32}
                    className: {type: string, maxLength: 253}
                repository:
                  type: object
                  required: [url, commit]
                  properties:
                    url: {type: string, pattern: '^https://', maxLength: 2048}
                    commit: {type: string, pattern: '^[a-f0-9]{40,64}$', maxLength: 64}
                envSecret: {type: string, maxLength: 253}
                reuseSources:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    required: [taskId, stages]
                    properties:
                      taskId: {type: string, minLength: 1, maxLength: 256}
                      stages:
                        type: array
                        maxItems: 32
                        items: {type: string, maxLength: 63}
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties: {type: string}
                    limits:
                      type: object
                      additionalProperties: {type: string}
                stages:
                  type: array
                  minItems: 1
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, command]
                    properties:
                      id: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$', maxLength: 63}
                      command:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items: {type: string, minLength: 1, maxLength: 32768}
                      inputDigest: {type: string, pattern: '^[a-f0-9]{64}$', maxLength: 64}
                      outputs:
                        type: array
                        maxItems: 128
                        items: {type: string, minLength: 1, maxLength: 1024}
                      dependsOn:
                        type: array
                        maxItems: 32
                        items: {type: string, maxLength: 63}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
